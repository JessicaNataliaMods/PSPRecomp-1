; VCSNative optional shader extension layer.
;
; The host renderer and the stock game do NOT depend on the private shader pack.
; If profiles/vcs/host/propershaders/private is absent when CMake configures the
; project, VCSNative builds the public stubs and renders the original game.
;
; Keep all optional/custom shader configuration in this file. VCSNative.ini is
; reserved for the core renderer/runtime.

[ProperShaders]
Enabled=true

; Dedicated material pipes. Each pipe has its own private .cpp implementation.
; WorldPipe (the Building pipe internally) receives ordinary world/building/object geometry.
[WorldPipe]
Enabled=true
DebugColor=false
DebugR=0.05
DebugG=1.00
DebugB=0.05

; SkinPipe is selected from the actual PSP GE skin-weight vertex layout.
[SkinPipe]
Enabled=true
DebugColor=false
DebugR=1.00
DebugG=0.05
DebugB=1.00

; VehiclePipe learns recolourable VCS vehicle materials from CLUT mutations.
[VehiclePipe]
Enabled=true
PaletteClassifier=true
DebugColor=false
DebugR=0.05
DebugG=0.55
DebugB=1.00

; Modern DX12 directional shadow map with PCF, sampled directly by each
; World/Skin/Vehicle material shader. The old fullscreen contact composite is not used.
[RealtimeShadows]
; The directional map is now sampled by the actual World/Skin/Vehicle material
; shaders. There is no fullscreen/contact-shadow composite in this path.
Enabled=true
; Stable camera-centred directional shadow map. 2048 is the default quality.
MapResolution=2048
WorldRadius=140.0
DepthRange=420.0
MapBias=0.0015
PcfRadius=1
; Keep shadows and CloudWorks driven by the same sun direction by default.
UseCloudSunDirection=true
LightDirectionX=0.38
LightDirectionY=-0.28
LightDirectionZ=0.88
Strength=0.58
; Shadow debug views (restart required because material variants are compiled at startup):
; 0 = normal lighting/shadows
; 1 = raw directional shadow map fullscreen (caster/depth proof)
; 2 = receiver shadow mask: white=shadow, black=lit
; 3 = light projection/coverage: RG=shadow UV, blue=inside map, red=outside
; 4 = sampled shadow-map depth on receivers (grayscale)
; 5 = receiver depth in light space (grayscale)
; 6 = compare result: red=blocked, green=lit
DebugMode=0
; Legacy contact-shadow setting retained for config compatibility; unused by the material path.
ContactShadows=false
ContactStrength=0.22
Steps=12
MaxDistancePixels=28.0
Thickness=0.0025
LightScreenX=-0.55
LightScreenY=0.75

; CloudWorks/ProperShaders volumetric-cloud port. It now lives in the same
; optional private shader module instead of the core GE backend.
[VolumetricClouds]
Enabled=true
DownscaleDiv=2
Layers=2
ShadowSteps=8
Opacity=1.0
Speed=0.0
Brightness=1.0
RandomSeed=0.0

; PLACEHOLDER: weather-derived coverage for each physical cloud deck.
CoverageLow=0.72
CoverageMid=0.52
CoverageHigh=0.28

; PLACEHOLDER: timecycle sun/moon state.
SunDirectionX=0.38
SunDirectionY=-0.28
SunDirectionZ=0.88
SunColorR=1.0
SunColorG=0.97
SunColorB=0.88
DayProgression=0.88

; PLACEHOLDER: timecycle cloud/fog colours and weather density.
CloudBaseColorR=0.70
CloudBaseColorG=0.70
CloudBaseColorB=0.70
AtmosphereDensity=0.0
Mist=0.50
FogColorR=0.58
FogColorG=0.68
FogColorB=0.78
FogStart=4500.0

; Temporal resolve controls.
TemporalBlend=0.50
TemporalDenoise=1.0
TemporalClamp=1.0

; Reserved for the old SimulateHDR port. Its DX12 implementation is currently
; disabled, but its settings live here rather than VCSNative.ini.
[SimulateHDR]
Enabled=false
